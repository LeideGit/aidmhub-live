<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Planering – AI DM HUB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="planning.css">
</head>
<body>
    <header class="header">
        <div class="header-branding">
            <div class="logo">🗂️</div>
            <div class="header-text">
                <h1>Planering</h1>
                <p class="subtitle">Skrivskyddad statusbild av projektet, från project/progress.md</p>
            </div>
        </div>
        <div class="header-controls">
            <a href="index.html" class="control-btn">← Tillbaka till hubben</a>
        </div>
    </header>

    <main class="planning-main">
        <p id="planningStatus" class="planning-status" role="status">Laddar status…</p>

        <div class="kanban" id="kanban">
            <section class="kanban-column" aria-labelledby="col-done-title">
                <h2 id="col-done-title" class="kanban-column-title">Klart <span class="kanban-count" data-count="done"></span></h2>
                <ul class="kanban-list" data-column="done" aria-labelledby="col-done-title"></ul>
            </section>
            <section class="kanban-column" aria-labelledby="col-progress-title">
                <h2 id="col-progress-title" class="kanban-column-title">Pågår <span class="kanban-count" data-count="in_progress"></span></h2>
                <ul class="kanban-list" data-column="in_progress" aria-labelledby="col-progress-title"></ul>
            </section>
            <section class="kanban-column" aria-labelledby="col-pending-title">
                <h2 id="col-pending-title" class="kanban-column-title">Väntar <span class="kanban-count" data-count="pending"></span></h2>
                <ul class="kanban-list" data-column="pending" aria-labelledby="col-pending-title"></ul>
            </section>
        </div>
    </main>

    <script src="planning.js"></script>
</body>
</html>
